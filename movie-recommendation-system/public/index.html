
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Movie Recommendation System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            color: #38bdf8;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 40px;
        }

        section {
            background: #1e293b;
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 30px;
        }

        input {
            width: 75%;
            padding: 13px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #38bdf8;
        }

        button {
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .movie-card {
            background: #334155;
            padding: 18px;
            border-radius: 12px;
            transition: transform 0.2s;
            overflow: hidden;
        }

        .movie-card:hover {
            transform: translateY(-5px);
        }

        .movie-poster {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #0f172a;
        }

        .movie-card h3 {
            color: #38bdf8;
            margin-top: 0;
        }

        .movie-card p {
            color: #cbd5e1;
            line-height: 1.5;
        }

        .movie-meta {
            color: #94a3b8 !important;
            font-size: 13px;
        }

        .similarity {
            color: #4ade80 !important;
            font-weight: bold;
        }

        .status {
            color: #94a3b8;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            input {
                width: 100%;
                margin-bottom: 12px;
            }

            button {
                width: 100%;
            }

            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎬 AI Movie Recommendation System</h1>

        <p class="subtitle">
            Discover movies using AI-powered semantic search.
        </p>

        <!-- Semantic Search -->

        <section>

            <h2>🔍 Search Movies</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Example: I want a space survival movie"
            />

            <button id="searchButton">Search</button>

            <div id="searchResults"></div>

        </section>


        <!-- Similar Movie Recommendations -->

        <section>

            <h2>🎯 Find Similar Movies</h2>

            <input
                type="text"
                id="movieInput"
                placeholder="Enter a movie title, e.g. Interstellar"
            />

            <button id="similarButton">Find Similar</button>

            <div id="similarResults"></div>

        </section>

    </div>


    <script>

        // DOM ELEMENTS

        const searchInput = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const searchResults = document.getElementById("searchResults");

        const movieInput = document.getElementById("movieInput");
        const similarButton = document.getElementById("similarButton");
        const similarResults = document.getElementById("similarResults");


        // FETCH MOVIE DETAILS FROM TMDB

        async function getMovieDetails(title) {

            try {

                const response = await fetch(
                    `/api/tmdb/${encodeURIComponent(title)}`
                );

                if (!response.ok) {
                    return null;
                }

                return await response.json();

            } catch (error) {

                console.error("TMDB error:", error);

                return null;
            }
        }


        // CREATE MOVIE CARDS

        async function displayMovies(movies, container) {

            if (!movies || movies.length === 0) {
                container.innerHTML = "<p>No movies found.</p>";
                return;
            }

            container.innerHTML =
                '<p class="status">Loading movie posters...</p>';

            const movieCards = await Promise.all(

                movies.map(async (movie) => {

                    const details = await getMovieDetails(movie.title);

                    const poster = details?.poster;

                    const releaseYear = details?.releaseDate
                        ? details.releaseDate.substring(0, 4)
                        : "Year unavailable";

                    const rating = details?.rating != null
                        ? Number(details.rating).toFixed(1) + "/10"
                        : "Not available";

                    return `
                        <div class="movie-card">

                            ${
                                poster
                                    ? `<img
                                        class="movie-poster"
                                        src="${poster}"
                                        alt="${movie.title} poster"
                                        loading="lazy"
                                    >`
                                    : `<div class="movie-poster"
                                        style="display:flex;align-items:center;justify-content:center;color:#94a3b8;">
                                        Poster unavailable
                                    </div>`
                            }

                            <h3>${movie.title}</h3>

                            <p>${movie.description}</p>

                            <p class="movie-meta">
                                Release year: ${releaseYear}
                            </p>

                            <p class="movie-meta">
                                TMDB Rating: ⭐ ${rating}
                            </p>

                            ${
                                typeof movie.match === "number"
                                    ? `<p class="similarity">
                                        Similarity: ${(movie.match * 100).toFixed(2)}%
                                    </p>`
                                    : ""
                            }

                        </div>
                    `;

                })

            );

            container.innerHTML = `
                <div class="movie-grid">
                    ${movieCards.join("")}
                </div>
            `;
        }


        // SEMANTIC MOVIE SEARCH

        searchButton.addEventListener("click", async () => {

            const query = searchInput.value.trim();

            if (!query) {
                alert("Please enter a search query");
                return;
            }

            searchButton.disabled = true;

            searchResults.innerHTML =
                '<p class="status">AI is searching for movies...</p>';

            try {

                const response = await fetch("/api/movies/search", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({ query })

                });

                if (!response.ok) {
                    throw new Error("Failed to search movies");
                }

                const movies = await response.json();

                await displayMovies(movies, searchResults);

            } catch (error) {

                searchResults.innerHTML =
                    "<p>Something went wrong. Please try again.</p>";

                console.error(error);

            } finally {

                searchButton.disabled = false;

            }

        });


        // SIMILAR MOVIE RECOMMENDATIONS

        similarButton.addEventListener("click", async () => {

            const title = movieInput.value.trim();

            if (!title) {
                alert("Please enter a movie title");
                return;
            }

            similarButton.disabled = true;

            similarResults.innerHTML =
                '<p class="status">Finding similar movies...</p>';

            try {

                const response = await fetch(
                    `/api/movies/${encodeURIComponent(title)}/similar`
                );

                if (!response.ok) {
                    throw new Error("Movie not found or request failed");
                }

                const movies = await response.json();

                await displayMovies(movies, similarResults);

            } catch (error) {

                similarResults.innerHTML =
                    "<p>Unable to find similar movies. Check the movie title.</p>";

                console.error(error);

            } finally {

                similarButton.disabled = false;

            }

        });


        // ALLOW ENTER KEY TO SEARCH

        searchInput.addEventListener("keydown", (event) => {

            if (event.key === "Enter") {
                searchButton.click();
            }

        });

        movieInput.addEventListener("keydown", (event) => {

            if (event.key === "Enter") {
                similarButton.click();
            }

        });

    </script>

</body>
</html>
